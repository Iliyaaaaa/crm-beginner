apiVersion: apps/v1
kind: Deployment

metadata:
  name: crm-server
  labels:
    app: crm-server

spec:
  replicas: 3

  selector:
    matchLabels:
      app: crm-server

  template:
    metadata:
      labels:
        app: crm-server

    spec:
      containers:
        - name: crm-server
          image: crm-service:v5

          imagePullPolicy: IfNotPresent

          ports:
            - name: grpc
              containerPort: 50051

          envFrom:
            - configMapRef:
                name: crm-server-config
            - secretRef:
                name: crm-server-secret

          # "Should traffic come to me?" While the app is still connecting to
          # Postgres and Redis it is alive but not ready, and this keeps the
          # Service from sending requests that would fail. It is also what
          # makes a rolling update zero-downtime: an old pod is only removed
          # once the new one reports ready.
          #
          # A native grpc probe calls the app's grpc.health.v1.Health service,
          # so the answer comes from the gRPC layer itself rather than from a
          # TCP port merely being open - and it turns NOT_SERVING the moment
          # shutdown begins.
          #
          # The port must be the NUMBER. Unlike tcpSocket and httpGet, grpc
          # probes do not support named ports, so `port: grpc` is rejected.
          readinessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          # "Am I broken?" A failure here KILLS the container, so these numbers
          # are deliberately more generous: an over-eager liveness probe kills
          # healthy pods that are merely busy, moving their traffic onto the
          # remaining pods until the whole service collapses one pod at a time.
          livenessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          # requests and limits do two different jobs. requests is what the
          # scheduler reserves when choosing a node; limits is the ceiling
          # enforced while the container runs.
          #
          # The two resources behave differently at the ceiling: going over the
          # CPU limit only throttles the container, while going over the memory
          # limit KILLS it (OOMKilled) - memory already handed out cannot be
          # taken back. So the memory limit is the one to keep generous.
          #
          # Setting these also moves the pod out of the BestEffort QoS class,
          # which is the class the kubelet evicts FIRST when a node runs short
          # of memory. With requests below limits the pod becomes Burstable.
          #
          # Starting values for a small Go service; measure with `kubectl top
          # pods` (needs `minikube addons enable metrics-server`) at idle and
          # under load, then adjust.
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
